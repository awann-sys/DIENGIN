name: DIENGIN 2025-2026 Model OOD Audit

on:
  push:
    branches: [main]
    paths:
      - "src/audit_ood_2025_2026.py"
      - ".github/workflows/audit-ood-2025-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-ood-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Jakarta
      AWS_API_USERNAME: ${{ secrets.AWS_API_USERNAME }}
      AWS_API_PASSWORD: ${{ secrets.AWS_API_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_cloud.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_cloud.txt

      - name: Run model integrity and OOD audit
        run: python src/audit_ood_2025_2026.py

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: diengin-model-ood-audit-2025-2026
          path: |
            output/ood_audit_2025_2026/
          retention-days: 14
