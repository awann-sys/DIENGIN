name: Verify AWS monthly download
on:
  push:
    branches: [main]
    paths: [src/probe_aws_month.py, .github/workflows/aws-monthly-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: diengin-aws-archive
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 requests==2.32.5
      - uses: actions/checkout@v4
        with:
          ref: aws-archive
          path: archive
      - name: Compare monthly and daily API results
        env:
          AWS_API_USERNAME: ${{ secrets.AWS_API_USERNAME }}
          AWS_API_PASSWORD: ${{ secrets.AWS_API_PASSWORD }}
        run: python -m src.probe_aws_month
      - name: Save verified observations and probe report
        if: always()
        run: |
          cd archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observations/ monthly_probe.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record monthly AWS API verification and downloaded observations'
            git push origin HEAD:aws-archive
          fi

