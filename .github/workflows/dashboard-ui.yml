name: Dashboard UI checks

on:
  pull_request:
    paths: [app.py, requirements_dashboard.txt, tests/**, .github/workflows/dashboard-ui.yml]
  workflow_dispatch:

concurrency:
  group: dashboard-ui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_dashboard.txt
      - name: Install dashboard and browser test dependencies
        run: |
          python -m pip install -r requirements_dashboard.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check syntax and dashboard behavior
        run: |
          python -m py_compile app.py tests/test_dashboard.py tests/browser_dashboard.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check desktop and mobile layouts
        run: python tests/browser_dashboard.py
      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diengin-ui-review
          path: ui-review/
          if-no-files-found: ignore
