name: DIENGIN Test Package

on:
  push:
    branches:
      - test/interpolated-backtest-20260915

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package current model files for local interpolation test
        uses: actions/upload-artifact@v4
        with:
          name: diengin-test-package
          path: models/
          retention-days: 1
