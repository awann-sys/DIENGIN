name: DIENGIN Batch Frost Backtest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backtest-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
      AWS_API_USERNAME: ${{ secrets.AWS_API_USERNAME }}
      AWS_API_PASSWORD: ${{ secrets.AWS_API_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_cloud.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_cloud.txt

      - name: Run requested historical backtests
        shell: bash
        run: |
          set -e
          DATES=(2026-08-26 2026-08-27 2026-08-31 2026-09-01 2026-09-06)
          for d in "${DATES[@]}"; do
            echo "=============================="
            echo "Backtest target: $d"
            echo "=============================="
            BACKTEST_TARGET_DATE="$d" python src/backtest_date.py
          done

      - name: Build combined summary
        shell: bash
        run: |
          python - <<'PY'
          import json, csv
          from pathlib import Path
          rows=[]
          for p in sorted(Path('output').glob('backtest_*/result.json')):
              d=json.loads(p.read_text())
              rows.append(d)
          out=Path('output/backtest_batch_summary.csv')
          fields=[
              'target_date','observed_frost','aws_rows','night_rows',
              'threshold_stacked','releases_valid','probability_max',
              'probability_max_hour_wib','first_threshold_exceed_hour_wib',
              'predicted_frost','verification'
          ]
          with out.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              for d in rows:
                  w.writerow({k:d.get(k) for k in fields})
          print(out.read_text())
          PY

      - name: Upload batch results
        uses: actions/upload-artifact@v4
        with:
          name: diengin-batch-backtest-2026-08-26_2026-09-06
          path: |
            output/backtest_*/
            output/backtest_batch_summary.csv
            data/backtest/*.csv
          retention-days: 14
