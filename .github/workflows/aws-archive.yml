name: AWS historical archive
on:
  push:
    branches: [main]
    paths: [src/archive_aws.py, .github/workflows/aws-archive.yml]
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: diengin-aws-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 requests==2.32.5
      - uses: actions/checkout@v4
        with:
          ref: aws-archive
          path: archive
      - name: Download recent data and resume backfill
        env:
          AWS_API_USERNAME: ${{ secrets.AWS_API_USERNAME }}
          AWS_API_PASSWORD: ${{ secrets.AWS_API_PASSWORD }}
        run: python -m src.archive_aws --root archive --days 30
      - name: Save archive and checkpoints even after partial failure
        if: always()
        run: |
          if [ ! -d archive/.git ]; then exit 0; fi
          cd archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observations/ archive_manifest.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update AWS monthly archive and historical progress'
            git push origin HEAD:aws-archive
          fi

