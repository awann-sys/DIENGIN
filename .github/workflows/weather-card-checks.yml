name: Weather Cards UI Checks
on:
  push:
    branches: [main]
    paths:
      - web2_visuals.py
      - tests/test_web2_visuals.py
      - .github/workflows/weather-card-checks.yml
  pull_request:
    paths:
      - nav_dashboard.py
      - web2_visuals.py
      - expressive_dashboard.py
      - tests/test_web2_visuals.py
      - dashboard_features.py
      - tests/test_weather_instrument_cards.py
      - .github/workflows/weather-card-checks.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dashboard dependencies
        run: python -m pip install --retries 8 --timeout 120 streamlit pandas
      - name: Compile Python files
        run: python -m py_compile dashboard_features.py nav_dashboard.py expressive_dashboard.py web2_visuals.py
      - name: Test weather instruments
        run: python -m unittest discover -s tests -p 'test_*visuals.py' -v && python -m unittest discover -s tests -p 'test_weather_instrument_cards.py' -v
