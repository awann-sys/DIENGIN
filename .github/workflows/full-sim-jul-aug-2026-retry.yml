name: DIENGIN Full Jul-Aug 2026 Simulation Retry

on:
  push:
    branches:
      - analysis/full-jul-aug-2026
    paths:
      - "src/full_sim_jul_aug_2026_retry.py"
      - ".github/workflows/full-sim-jul-aug-2026-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
      AWS_API_USERNAME: ${{ secrets.AWS_API_USERNAME }}
      AWS_API_PASSWORD: ${{ secrets.AWS_API_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_cloud.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_cloud.txt
      - name: Download first and run full simulation
        run: python src/full_sim_jul_aug_2026_retry.py
      - name: Show compact result
        if: always()
        run: |
          cat output/full_sim_jul_aug_2026/summary.json 2>/dev/null || true
          echo "===== FN ====="
          cat output/full_sim_jul_aug_2026/false_negatives_map.csv 2>/dev/null || true
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diengin-full-sim-jul-aug-2026-retry
          path: |
            output/full_sim_jul_aug_2026/
            data/analysis/aws_sta2285_2026-06-30_to_2026-09-01.csv
          if-no-files-found: warn
          retention-days: 14
