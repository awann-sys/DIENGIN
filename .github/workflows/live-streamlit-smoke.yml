name: Verify DIENGIN public deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-streamlit-smoke.yml
      - app_operational.py
      - nav_dashboard.py
      - web2_visuals.py
  workflow_dispatch:

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser automation
        run: python -m pip install --retries 5 selenium
      - name: Inspect actual public Streamlit rendering
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          options = Options()
          for flag in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1600,1000']:
              options.add_argument(flag)
          driver = webdriver.Chrome(options=options)
          try:
              url = 'https://frost-dew.streamlit.app/?theme=light'
              driver.get(url)
              print('PUBLIC_URL:', driver.current_url, flush=True)
              old = new = False
              for i in range(60):
                  time.sleep(3)
                  content = driver.find_element(By.TAG_NAME, 'body').text
                  old = 'Cuaca Dieng, lebih terbaca.' in content
                  new = bool(driver.find_elements(By.CSS_SELECTOR, '.dg2-hero'))
                  if i % 10 == 0 or new:
                      print(f'CHECK_{i}: old_heading={old}, web2_hero={new}, text_start={content[:180]!r}', flush=True)
                  if new:
                      break
              print('OLD_LAYOUT_FOUND:', old, flush=True)
              print('WEB2_HERO_FOUND:', new, flush=True)
              print('LIVE_TEXT_SNIPPET:', content[:2800].replace('\n',' | '), flush=True)
              driver.save_screenshot('streamlit-public.png')
              if not new:
                  raise SystemExit('Public deployment is not rendering Web 2.0 hero')
          finally:
              driver.quit()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamlit-public-screenshot
          path: streamlit-public.png
          if-no-files-found: ignore
