name = "diengin-scheduler"
main = "src/index.js"
compatibility_date = "2026-10-19"

[vars]
GITHUB_REPOSITORY = "awann-sys/DIENGIN"
GITHUB_WORKFLOW = "diengin-cloud.yml"
GITHUB_REF = "main"

[triggers]
# UTC; also :02, :17, :32, :47 in WIB. Allow AWS observations to arrive first.
crons = ["2,17,32,47 * * * *"]

[observability]
enabled = true

